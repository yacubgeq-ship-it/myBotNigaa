<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>⚓ Корабли — морской бой</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#ffffff; --fg:#111111; --sub:#888888; --card:#f2f2f2;
    --cell:#e9e9ec; --ship:#2f6fed; --hit:#e5484d; --sunk:#a33; --miss:#9ab0c9; --accent:#3390ec;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; padding:10px 12px 24px; background:var(--bg); color:var(--fg);
       font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; user-select:none;}
  h1{font-size:20px; margin:4px 0 10px; text-align:center;}
  #status{min-height:38px; text-align:center; font-size:14px; margin:2px 0 8px; padding:6px 8px;
          background:var(--card); border-radius:10px;}
  .panel{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:8px 0;}
  .panel button{font-size:14px; padding:8px 10px; border-radius:10px; border:none;
                background:var(--cell); color:var(--fg);}
  .panel button.sel{outline:2px solid var(--accent); font-weight:700;}
  .panel button:disabled{opacity:.45;}
  .board-title{font-size:13px; color:var(--sub); text-align:center; margin:8px 0 4px;}
  .board{display:grid; grid-template-columns:20px repeat(10,1fr); gap:2px; max-width:420px; margin:0 auto;}
  .lbl{display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--sub);}
  .cell{aspect-ratio:1/1; border-radius:5px; background:var(--cell); display:flex; align-items:center;
        justify-content:center; font-size:13px; line-height:1;}
  .cell.ship{background:var(--ship); color:#fff;}
  .cell.hit{background:var(--hit); color:#fff;}
  .cell.sunk{background:var(--sunk); color:#fff;}
  .cell.miss{background:var(--cell); color:var(--miss);}
  .cell.water{color:var(--miss); font-size:11px;}
  .cell.preview{outline:2px solid var(--accent);}
  .cell.aim{outline:2px solid var(--hit);}
  #enemyBoard .cell{cursor:pointer;}
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center;
           justify-content:center; z-index:10;}
  .overlay.hidden{display:none;}
  .card{background:var(--bg); color:var(--fg); border-radius:14px; padding:20px; text-align:center;
        max-width:300px; width:86%;}
  .card h2{margin:0 0 8px; font-size:20px;}
  .card p{margin:0 0 14px; font-size:14px; color:var(--sub);}
  .card button{width:100%; padding:12px; font-size:16px; border:none; border-radius:10px;
               background:var(--accent); color:#fff;}
  .stack{display:flex; flex-direction:column;}
  .prow{display:flex; align-items:center; justify-content:space-between; gap:8px;
        padding:8px 6px; border-bottom:1px solid var(--card); font-size:14px;}
  .prow .pbtn{padding:8px 12px; border-radius:8px; border:none; background:var(--accent); color:#fff; font-size:13px;}
  .prow .pbtn[disabled]{opacity:.45;}
</style>
</head>
<body>
<h1>⚓ Корабли</h1>
<div id="status">Расставьте флот: выберите корабль и нажмите две клетки</div>

<div id="placeUI">
  <div class="panel" id="shipButtons"></div>
  <div class="panel">
    <button id="btnRandom">🎲 Случайно</button>
    <button id="btnReset">🔄 Сброс</button>
    <button id="btnFight" disabled>⚔️ В бой!</button>
  </div>
</div>

<div id="battleUI" style="display:none">
  <div class="panel">
    <button id="btnNew">🔄 Новая игра</button>
  </div>
</div>

<div class="board-title" id="ownTitle">⚓ Ваш флот</div>
<div class="board" id="ownBoard"></div>
<div class="board-title" id="enemyTitle" style="display:none">🎯 Поле противника — тапайте по клеткам</div>
<div class="board" id="enemyBoard" style="display:none"></div>

<div class="overlay hidden" id="intro">
  <div class="card">
    <h2>⚓ Корабли</h2>
    <p>Классический морской бой. Выберите режим:</p>
    <div class="stack">
      <button id="btnModeBot" style="background:#2f6fed">🤖 С ботом</button>
      <button id="btnModePvp" style="background:#2e9e4f; margin-top:8px">👥 С друзьями (онлайн)</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="lobby">
  <div class="card" style="max-width:340px; text-align:left; max-height:80vh; overflow-y:auto;">
    <h2 style="text-align:center">👥 Игроки онлайн</h2>
    <p style="text-align:center">Выберите соперника — он получит вызов от бота в личку</p>
    <div id="lobbyList"></div>
    <div id="lobbyStatus" style="font-size:13px; color:var(--sub); margin:10px 0; text-align:center"></div>
    <button id="btnLobbyBack" style="background:var(--cell); color:var(--fg); margin-top:6px">← Назад</button>
  </div>
</div>

<div class="overlay hidden" id="result">
  <div class="card">
    <h2 id="resTitle"></h2>
    <p id="resText"></p>
    <button id="btnAgain">🔄 Играть снова</button>
  </div>
</div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
try { if (tg) { tg.ready(); tg.expand(); } } catch(e) {}

const SIZE = 10;
const LETTERS = ["А","Б","В","Г","Д","Е","Ж","З","И","К"];
const FLEET = [4,3,3,2,2,2,1,1,1,1];
const SHIP_NAMES = {4:"Линкор", 3:"Крейсер", 2:"Эсминец", 1:"Катер"};

let phase = "place";
let selLen = 4;
let anchor = null;
let orient = "h";
let fleetLeft = {};
let player = null, playerShips = [];
let enemy = null, enemyShips = [];
let aiFired = new Set();
let playerFired = new Set();
let aiTargets = [];
let playerTurn = true;
let playerSunk = 0, enemySunk = 0;

const $ = id => document.getElementById(id);
const K = (r,c) => r + "," + c;

function emptyBoard(){ return Array.from({length:SIZE}, () => Array(SIZE).fill(0)); }
// клетки: 0 пусто, 1 корабль, 2 попадание, 3 промах

function canPlace(g, r, c, len, orient){
  const cells = [];
  for (let i = 0; i < len; i++){
    const nr = r + (orient === "v" ? i : 0), nc = c + (orient === "h" ? i : 0);
    if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) return {ok:false, msg:"🚫 Корабль выходит за границы поля"};
    if (g[nr][nc] === 1) return {ok:false, msg:"🚫 Здесь уже стоит корабль"};
    cells.push([nr, nc]);
  }
  for (const [nr, nc] of cells){
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++){
      const rr = nr + dr, cc = nc + dc;
      if (rr < 0 || rr >= SIZE || cc < 0 || cc >= SIZE) continue;
      if (g[rr][cc] === 1 && !cells.some(([a,b]) => a === rr && b === cc))
        return {ok:false, msg:"🚫 Корабли не могут соприкасаться — отодвиньте на клетку"};
    }
  }
  return {ok:true, cells};
}

function placeRandom(g, ships){
  for (const len of FLEET){
    let done = false;
    for (let t = 0; t < 600 && !done; t++){
      const o = Math.random() < 0.5 ? "h" : "v";
      const r = Math.floor(Math.random() * (o === "v" ? SIZE - len + 1 : SIZE));
      const c = Math.floor(Math.random() * (o === "h" ? SIZE - len + 1 : SIZE));
      const res = canPlace(g, r, c, len, o);
      if (res.ok){
        res.cells.forEach(([a,b]) => g[a][b] = 1);
        ships.push({cells:res.cells, hits:0, sunk:false});
        done = true;
      }
    }
    if (!done) return false;
  }
  return true;
}

function haptic(kind){
  try{
    if (!tg || !tg.HapticFeedback) return;
    if (kind === "success" || kind === "error") tg.HapticFeedback.notificationOccurred(kind);
    else tg.HapticFeedback.impactOccurred(kind);
  } catch(e){}
}

function setStatus(t){ $("status").textContent = t; }

function buildBoard(el, isOwn){
  let html = '<div class="lbl"></div>';
  for (let c = 0; c < SIZE; c++) html += '<div class="lbl">' + LETTERS[c] + '</div>';
  for (let r = 0; r < SIZE; r++){
    html += '<div class="lbl">' + (r + 1) + '</div>';
    for (let c = 0; c < SIZE; c++){
      const g = isOwn ? player.g : enemy.g;
      const v = g[r][c];
      let cls = "cell", sym = "·";
      if (isOwn){
        if (v === 1) { cls += " ship"; sym = "▪"; }
        else if (v === 2) { cls += " hit"; sym = "✕"; }
        else if (v === 3) { cls += " miss"; sym = "•"; }
        else sym = "";
      } else {
        const ship = shipAt(enemyShips, r, c);
        if (ship && ship.sunk) { cls += " sunk"; sym = "☒"; }
        else if (v === 2) { cls += " hit"; sym = "✕"; }
        else if (v === 3) { cls += " miss"; sym = "•"; }
        else sym = "";
        if (v === 2) cls += " aim";
      }
      if (isOwn && anchor){
        const [ar, ac] = anchor;
        if (r === ar && c === ac) cls += " preview";
        else if (r === ar && c > ac && c - ac < selLen) cls += " preview";
        else if (c === ac && r > ar && r - ar < selLen) cls += " preview";
      }
      if (phase === "place" || isOwn === false) html += '<div class="' + cls + '" data-r="' + r + '" data-c="' + c + '">' + sym + '</div>';
      else html += '<div class="' + cls + '">' + sym + '</div>';
    }
  }
  el.innerHTML = html;
}

function shipAt(ships, r, c){
  for (const s of ships) if (s.cells.some(([a,b]) => a === r && b === c)) return s;
  return null;
}

function renderShipButtons(){
  const box = $("shipButtons");
  box.innerHTML = "";
  const sizes = [4, 3, 2, 1];
  for (const len of sizes){
    const b = document.createElement("button");
    const left = fleetLeft[len];
    b.textContent = "🚢".repeat(len) + " ×" + left;
    if (len === selLen) b.classList.add("sel");
    if (left === 0){ b.disabled = true; b.textContent = "🚢".repeat(len) + " ✅"; }
    b.addEventListener("click", () => {
      if (fleetLeft[len] === 0) return;
      selLen = len; anchor = null;
      setStatus("Выбран корабль: " + SHIP_NAMES[len] + ". Нажмите клетку носа на своём поле");
      renderShipButtons(); buildBoard($("ownBoard"), true);
    });
    box.appendChild(b);
  }
}

function commitShip(cells){
  cells.forEach(([a,b]) => player.g[a][b] = 1);
  playerShips.push({cells:cells, hits:0, sunk:false});
  fleetLeft[selLen]--;
  anchor = null;
  renderShipButtons(); buildBoard($("ownBoard"), true);
  const total = Object.values(fleetLeft).reduce((a,b) => a + b, 0);
  if (total === 0){
    setStatus("✅ Флот готов! Нажмите «⚔️ В бой!»");
    $("btnFight").disabled = false;
  } else {
    setStatus("Корабль установлен. Осталось: " + Object.entries(fleetLeft).filter(([,v]) => v > 0).map(([k,v]) => v + "×" + k).join(", "));
  }
}

function resetPlace(){
  player = {g: emptyBoard()}; playerShips = [];
  fleetLeft = {4:1, 3:2, 2:3, 1:4};
  anchor = null; selLen = 4;
  $("btnFight").disabled = true;
  renderShipButtons(); buildBoard($("ownBoard"), true);
}

$("ownBoard").addEventListener("click", e => {
  if (phase !== "place") return;
  const cell = e.target.closest(".cell[data-r]");
  if (!cell) return;
  const r = +cell.dataset.r, c = +cell.dataset.c;
  if (selLen === 1){
    const res = canPlace(player.g, r, c, 1, "h");
    if (res.ok){ haptic("light"); commitShip(res.cells); } else { haptic("error"); setStatus(res.msg); }
    return;
  }
  if (!anchor){
    const res = canPlace(player.g, r, c, 1, "h");
    if (!res.ok){ haptic("error"); setStatus(res.msg); return; }
    anchor = [r, c];
    setStatus("Нос выбран. Нажмите клетку кормы — по той же строке или столбцу");
    buildBoard($("ownBoard"), true);
    return;
  }
  const [ar, ac] = anchor;
  if (r === ar && c === ac){
    anchor = null; setStatus("Расстановка отменена"); buildBoard($("ownBoard"), true); return;
  }
  if (r !== ar && c !== ac){
    haptic("error"); setStatus("🚫 Не по линии: корма должна быть на той же строке или столбце"); return;
  }
  const placedLen = Math.abs(r - ar) + Math.abs(c - ac) + 1;
  if (placedLen !== selLen){
    haptic("error"); setStatus("🚫 Длина не та: выбрано " + placedLen + " клеток, а нужно " + selLen); return;
  }
  const o = (r === ar) ? "h" : "v";
  const rr = Math.min(r, ar), cc = Math.min(c, ac);
  const res = canPlace(player.g, rr, cc, selLen, o);
  if (res.ok){ haptic("light"); commitShip(res.cells); }
  else { haptic("error"); setStatus(res.msg); anchor = null; buildBoard($("ownBoard"), true); }
});

$("btnRandom").addEventListener("click", () => {
  playerShips = [];
  resetPlaceKeepBtn();
  while (!placeRandom(player.g, playerShips)){ player.g = emptyBoard(); playerShips = []; }
  fleetLeft = {4:0, 3:0, 2:0, 1:0};
  renderShipButtons(); buildBoard($("ownBoard"), true);
  setStatus("🎲 Флот расставлен случайно. Нажмите «⚔️ В бой!»");
  $("btnFight").disabled = false;
});

function resetPlaceKeepBtn(){ player = {g: emptyBoard()}; playerShips = []; anchor = null; }

$("btnReset").addEventListener("click", () => { resetPlace(); setStatus("Поле очищено"); });

$("btnFight").addEventListener("click", () => {
  enemy = {g: emptyBoard()}; enemyShips = [];
  while (!placeRandom(enemy.g, enemyShips)){ enemy.g = emptyBoard(); enemyShips = []; }
  aiFired = new Set(); aiTargets = []; playerFired = new Set();
  playerSunk = 0; enemySunk = 0; playerTurn = true;
  phase = "battle";
  $("placeUI").style.display = "none";
  $("battleUI").style.display = "";
  $("enemyTitle").style.display = "";
  $("enemyBoard").style.display = "";
  setStatus("⚔️ Бой начался! Ваш ход — тапайте по полю противника");
  buildBoard($("ownBoard"), true); buildBoard($("enemyBoard"), false);
});

$("btnNew").addEventListener("click", () => {
  phase = "place";
  $("battleUI").style.display = "none";
  $("placeUI").style.display = "";
  $("enemyTitle").style.display = "none";
  $("enemyBoard").style.display = "none";
  resetPlace();
  setStatus("Расставьте флот: выберите корабль и нажмите две клетки");
});

$("enemyBoard").addEventListener("click", e => {
  if (phase === "pvp"){
    const cell = e.target.closest(".cell[data-r]");
    if (cell) pvpShoot(+cell.dataset.r, +cell.dataset.c);
    return;
  }
  if (phase !== "battle") return;
  if (!playerTurn){ setStatus("⏳ Сейчас ход противника, подождите"); return; }
  const cell = e.target.closest(".cell[data-r]");
  if (!cell) return;
  const r = +cell.dataset.r, c = +cell.dataset.c;
  if (playerFired.has(K(r,c))){ haptic("error"); setStatus("🚫 Сюда вы уже стреляли"); return; }
  playerFired.add(K(r,c));
  if (enemy.g[r][c] === 1){
    enemy.g[r][c] = 2;
    const ship = shipAt(enemyShips, r, c);
    ship.hits++;
    if (ship.hits === ship.cells.length){
      ship.sunk = true; enemySunk++;
      haptic("heavy");
      setStatus("💥 Потоплен " + SHIP_NAMES[ship.cells.length] + "! Стреляйте ещё");
      if (enemySunk === FLEET.length){ gameOver(true); return; }
    } else {
      haptic("medium");
      setStatus("🔥 Попадание! Стреляйте ещё");
    }
  } else {
    enemy.g[r][c] = 3;
    haptic("light");
    playerTurn = false;
    setStatus("🌊 Промах. Ход противника…");
  }
  buildBoard($("ownBoard"), true); buildBoard($("enemyBoard"), false);
  if (!playerTurn) setTimeout(aiShoot, 800);
});

function aiPickCell(){
  let cell = aiTargets.find(t => !aiFired.has(K(t[0], t[1])));
  if (cell) return cell;
  aiTargets = aiTargets.filter(t => !aiFired.has(K(t[0], t[1])));
  const cands = [];
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++)
    if (!aiFired.has(K(r,c))) cands.push([r,c]);
  const even = cands.filter(([r,c]) => (r + c) % 2 === 0);
  const pool = (even.length && cands.length > 8) ? even : cands;
  return pool[Math.floor(Math.random() * pool.length)];
}

function aiShoot(){
  if (phase !== "battle" || playerTurn) return;
  const [r, c] = aiPickCell();
  aiFired.add(K(r,c));
  const g = player.g;
  if (g[r][c] === 1){
    g[r][c] = 2;
    const ship = shipAt(playerShips, r, c);
    ship.hits++;
    if (ship.hits === ship.cells.length){
      ship.sunk = true; playerSunk++;
      const around = new Set();
      for (const [a,b] of ship.cells)
        for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++){
          const rr = a + dr, cc = b + dc;
          if (rr >= 0 && rr < SIZE && cc >= 0 && cc < SIZE) around.add(K(rr,cc));
        }
      aiTargets = aiTargets.filter(t => !around.has(K(t[0], t[1])));
      setStatus("💥 Противник потопил ваш " + SHIP_NAMES[ship.cells.length].toLowerCase() + "!");
      if (playerSunk === FLEET.length){ gameOver(false); return; }
    } else {
      for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const rr = r + dr, cc = c + dc;
        if (rr >= 0 && rr < SIZE && cc >= 0 && cc < SIZE && !aiFired.has(K(rr,cc))) aiTargets.push([rr, cc]);
      }
      setStatus("🔥 Противник попал и стреляет ещё…");
    }
    buildBoard($("ownBoard"), true);
    setTimeout(aiShoot, 800);
  } else {
    g[r][c] = 3;
    playerTurn = true;
    setStatus("🌊 Противник промахнулся. Ваш ход!");
    buildBoard($("ownBoard"), true); buildBoard($("enemyBoard"), false);
  }
}

function gameOver(win){
  phase = "over";
  $("resTitle").textContent = win ? "🏆 Победа!" : "💀 Поражение";
  $("resText").textContent = win ? "Флот противника уничтожен. +300 🪙" : "Ваш флот уничтожен.";
  haptic(win ? "success" : "error");
  buildBoard($("ownBoard"), true); buildBoard($("enemyBoard"), false);
  if (win && lastMode === "bot" && API_BASE && tg && tg.initDataRaw){
    api("/api/gameover_bot", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({auth:tg.initDataRaw})})
      .then(res => { if (res.ok) $("resText").textContent = "Флот противника уничтожен. +" + res.reward + " 🪙"; })
      .catch(() => {});
  }
  setTimeout(() => $("result").classList.remove("hidden"), 600);
}

let lastMode = "bot";
$("btnModeBot").addEventListener("click", () => {
  $("intro").classList.add("hidden"); lastMode = "bot"; haptic("light");
});
$("btnModePvp").addEventListener("click", () => {
  haptic("light");
  if (!API_BASE){ showIntro(); setStatus("🚫 Откройте игру через кнопку бота"); return; }
  if (!tg || !tg.initDataRaw){ setStatus("🚫 Откройте игру через кнопку бота, чтобы мы знали, кто вы"); return; }
  $("intro").classList.add("hidden");
  $("lobby").classList.remove("hidden");
  loadLobby();
  lobbyTimer = setInterval(loadLobby, 5000);
});
$("btnLobbyBack").addEventListener("click", () => {
  $("lobby").classList.add("hidden");
  clearInterval(lobbyTimer); lobbyTimer = null;
  showIntro();
});
function showIntro(){ $("intro").classList.remove("hidden"); }

$("btnAgain").addEventListener("click", () => {
  $("result").classList.add("hidden");
  if (lastMode === "pvp"){ stopPvp(); showIntro(); }
  else $("btnNew").click();
});

try{
  if (tg && tg.themeParams){
    const p = tg.themeParams;
    const r = document.documentElement.style;
    if (p.bg_color) r.setProperty("--bg", p.bg_color);
    if (p.text_color) r.setProperty("--fg", p.text_color);
    if (p.hint_color) r.setProperty("--sub", p.hint_color);
    if (p.secondary_bg_color) r.setProperty("--card", p.secondary_bg_color);
  }
}catch(e){}


// ==================== PvP: онлайн-игроки и личные вызовы ====================
const API_BASE = (location.protocol === "http:" || location.protocol === "https:") ? location.origin : "";
let pvpState = null, pvpTimer = null, lobbyTimer = null, waitingCid = null;

function api(path, opts){
  return fetch(API_BASE + path, opts).then(r => r.json());
}

function loadLobby(){
  if (!API_BASE || !tg || !tg.initDataRaw) return;
  api("/api/online?auth=" + encodeURIComponent(tg.initDataRaw))
    .then(res => {
      if (!res.ok) return;
      const box = $("lobbyList");
      if (!res.players.length){
        box.innerHTML = '<div style="color:var(--sub); font-size:13px; text-align:center; padding:12px 0">Пока никого нет в сети.<br>Откройте игру — и через минуту здесь появятся игроки</div>';
        return;
      }
      box.innerHTML = "";
      for (const p of res.players){
        const row = document.createElement("div");
        row.className = "prow";
        const nm = document.createElement("span");
        nm.textContent = p.name + (p.busy ? " (в бою)" : "");
        const b = document.createElement("button");
        b.className = "pbtn";
        b.textContent = "⚔️ Вызвать";
        b.disabled = !!p.busy;
        b.addEventListener("click", () => sendChallenge(p.uid, p.name));
        row.appendChild(nm); row.appendChild(b);
        box.appendChild(row);
      }
    })
    .catch(() => {});
}

function sendChallenge(uid, name){
  if (!API_BASE || !tg || !tg.initDataRaw) return;
  haptic("light");
  api("/api/challenge", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({auth:tg.initDataRaw, target:uid})})
    .then(res => {
      if (!res.ok){ $("lobbyStatus").textContent = "🚫 " + (res.error || "Ошибка вызова"); return; }
      waitingCid = res.cid;
      $("lobbyStatus").textContent = "📨 Вызов отправлен игроку " + name + ". Ждём ответ…";
      startWaitingPoll();
    })
    .catch(() => { $("lobbyStatus").textContent = "🚫 Сервер недоступен"; });
}

function startWaitingPoll(){
  if (pvpTimer) clearInterval(pvpTimer);
  pvpTimer = setInterval(pollState, 2500);
  pollState();
}

function stopPvp(){
  if (pvpTimer){ clearInterval(pvpTimer); pvpTimer = null; }
  waitingCid = null; pvpState = null;
}

function pollState(){
  if (!API_BASE || !tg || !tg.initDataRaw) return;
  api("/api/state?auth=" + encodeURIComponent(tg.initDataRaw))
    .then(res => {
      if (!res.ok) return;
      if (res.game && res.game.status === "fight"){
        if ($("lobby") && !$("lobby").classList.contains("hidden")){
          $("lobby").classList.add("hidden");
          clearInterval(lobbyTimer); lobbyTimer = null;
        }
        enterPvP(res.game);
      } else if (!res.game && waitingCid){
        const ch = res.challenge;
        if (ch && ch.cid === waitingCid && ch.status === "wait"){
          $("lobbyStatus").textContent = "📨 Вызов отправлен игроку " + ch.other + ". Ждём ответ…";
        } else {
          waitingCid = null;
          if (pvpTimer){ clearInterval(pvpTimer); pvpTimer = null; }
          $("lobbyStatus").textContent = "❌ Вызов отклонён или истёк. Выберите другого игрока";
        }
      }
    })
    .catch(() => {});
}

function enterPvP(st){
  pvpState = st;
  phase = "pvp";
  $("placeUI").style.display = "none";
  $("battleUI").style.display = "";
  $("enemyTitle").style.display = "";
  $("enemyTitle").textContent = "🎯 " + (st.opp ? st.opp.name : "Соперник") + " — тапайте по клеткам";
  $("enemyBoard").style.display = "";
  paintPvP();
  if (st.finished){
    pvpOver(st.finished === "win");
  } else {
    setStatus(st.my_turn ? "⚔️ ВАШ ХОД — тапайте по полю соперника" : "⏳ Ход соперника…");
  }
}

function paintPvP(){
  const st = pvpState;
  if (!st) return;
  // своё поле: свои корабли + выстрелы соперника по нам
  let oh = "";
  oh += '<div class="lbl"></div>';
  for (let c = 0; c < SIZE; c++) oh += '<div class="lbl">' + LETTERS[c] + '</div>';
  const myShots = {}; // выстрелы соперника: hits/misses
  for (let r = 0; r < SIZE; r++){
    oh += '<div class="lbl">' + (r + 1) + '</div>';
    for (let c = 0; c < SIZE; c++){
      const k = "r" + r + ",c" + c;
      const shipCell = st.me.grid[k] === 1;
      let cls = "cell", sym = "";
      if (shipCell) { cls += " ship"; sym = "▪"; }
      if ((st.opp.hits || []).some(a => a[0] === r && a[1] === c)) { cls = "cell hit" + (shipCell ? "" : ""); sym = "✕"; }
      if ((st.opp.misses || []).some(a => a[0] === r && a[1] === c)) { cls = "cell miss"; sym = "•"; }
      if ((st.me.sunk_cells || []).some(a => a[0] === r && a[1] === c)) { cls = "cell sunk"; sym = "☒"; }
      oh += '<div class="' + cls + '">' + sym + '</div>';
    }
  }
  $("ownBoard").innerHTML = oh;
  // поле соперника: только наши выстрелы
  let eh = "";
  eh += '<div class="lbl"></div>';
  for (let c = 0; c < SIZE; c++) eh += '<div class="lbl">' + LETTERS[c] + '</div>';
  for (let r = 0; r < SIZE; r++){
    eh += '<div class="lbl">' + (r + 1) + '</div>';
    for (let c = 0; c < SIZE; c++){
      let cls = "cell", sym = "";
      if ((st.opp.sunk_cells || []).some(a => a[0] === r && a[1] === c)) { cls += " sunk"; sym = "☒"; }
      else if ((st.opp.hits || []).some(a => a[0] === r && a[1] === c)) { cls += " hit aim"; sym = "✕"; }
      else if ((st.opp.misses || []).some(a => a[0] === r && a[1] === c)) { cls += " miss"; sym = "•"; }
      eh += '<div class="' + cls + '" data-r="' + r + '" data-c="' + c + '">' + sym + '</div>';
    }
  }
  $("enemyBoard").innerHTML = eh;
}

function pvpShoot(r, c){
  const st = pvpState;
  if (!st || st.finished) return;
  if (!st.my_turn){ setStatus("⏳ Сейчас ход соперника, подождите"); return; }
  const k = "r" + r + ",c" + c;
  const already = (st.opp.hits || []).some(a => a[0] === r && a[1] === c) || (st.opp.misses || []).some(a => a[0] === r && a[1] === c);
  if (already){ haptic("error"); setStatus("🚫 Сюда вы уже стреляли"); return; }
  api("/api/move", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({auth:tg.initDataRaw, r:r, c:c})})
    .then(res => {
      if (!res.ok){
        if (res.error === "not_turn") setStatus("⏳ Сейчас ход соперника");
        else if (res.error === "repeat") setStatus("🚫 Сюда вы уже стреляли");
        else setStatus("🚫 " + (res.error || "Ошибка"));
        return;
      }
      pvpState = res.game;
      haptic(res.result === "miss" ? "light" : "heavy");
      if (res.result === "sunk") setStatus("💥 Потоплен корабль соперника! Стреляйте ещё");
      else if (res.result === "hit") setStatus("🔥 Попадание! Стреляйте ещё");
      else setStatus("🌊 Промах. Ход соперника…");
      paintPvP();
      if (pvpState.finished) pvpOver(pvpState.finished === "win");
    })
    .catch(() => setStatus("🚫 Сервер недоступен"));
}

function pvpOver(win){
  phase = "over";
  lastMode = "pvp";
  stopPvp();
  $("resTitle").textContent = win ? "🏆 Победа!" : "💀 Поражение";
  $("resText").textContent = win ? "Флот соперника уничтожен. +300 🪙" : "Ваш флот уничтожен.";
  haptic(win ? "success" : "error");
  paintPvP();
  setTimeout(() => $("result").classList.remove("hidden"), 600);
  // партия закончена — сервер больше не вернёт её в /api/state, чистим
  pvpState = null;
}

// при открытии приложения: если уже есть активная партия — сразу в бой
(function initPvp(){
  if (!API_BASE || !tg || !tg.initDataRaw) return;
  api("/api/state?auth=" + encodeURIComponent(tg.initDataRaw))
    .then(res => { if (res.ok && res.game && res.game.status === "fight") enterPvP(res.game); })
    .catch(() => {});
})();

resetPlace();
</script>
</body>
