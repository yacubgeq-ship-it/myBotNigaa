<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>⚓ Корабли — морской бой</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,#0b1020 0%,#10173a 100%);color:#e8ecff;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:14px 12px 40px}
.screen{display:none}.screen.active{display:block}
.logo{font-size:30px;font-weight:800;text-align:center;margin:14px 0 8px;letter-spacing:1px;text-shadow:0 2px 12px rgba(106,77,248,.5)}
.sub{color:#9fb0d8;text-align:center;font-size:13px;margin-bottom:18px;line-height:1.5}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:14px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;margin:12px 0;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.primary{background:linear-gradient(135deg,#2f7cf6,#6a4df8)}
.btn.duo{background:linear-gradient(135deg,#f68a2f,#f65a4d)}
.btn.ghost{background:#1b2340;color:#9fb0d8;font-weight:600}
.btn.small{padding:10px;font-size:14px}
.seclabel{text-align:center;font-weight:700;margin:12px 0 6px;font-size:15px}
.hint{color:#9fb0d8;text-align:center;font-size:12px;margin-bottom:8px}
.fieldrow{display:flex;align-items:stretch;gap:7px;justify-content:center;margin:10px 0}
.board{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;width:min(84vw,380px)}
.cell{aspect-ratio:1;border-radius:4px;background:#16204a;border:1px solid #2a3768;position:relative;display:flex;align-items:center;justify-content:center;font-size:10px}
.cell.inter{cursor:pointer}
.cell.inter:active{background:#22305f}
.cell.ship{background:linear-gradient(135deg,#2ec4b6,#1a9e91);border-color:#3fe0d0}
.cell.pend{background:#3f5bd8;box-shadow:0 0 8px #3f5bd8}
.cell.miss::after{content:"•";color:#5a76c9;font-size:16px;font-weight:700}
.cell.hit{background:#3a1420}
.cell.hit::after{content:"✕";color:#ff5a5a;font-size:13px;font-weight:800}
.cell.sunk{background:#7a2333;border-color:#ff5a5a}
.cell.sunk::after{content:"✕";color:#ffb0b0;font-size:13px;font-weight:800}
.vlabel{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:800;letter-spacing:2px;color:#ffd166;font-size:13px;text-align:center;padding:2px 0;white-space:nowrap}
.vlabel.enemy{color:#ff8fa3}
.fleetrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.fleetbtn{padding:8px 10px;border-radius:10px;border:1px solid #2a3768;background:#16204a;color:#e8ecff;font-size:12px;font-weight:700;cursor:pointer}
.fleetbtn.sel{background:#2f7cf6;border-color:#5ea0ff}
.fleetbtn.empty{opacity:.35}
.row2{display:flex;gap:10px}.row2 .btn{margin:12px 0}
.status{text-align:center;font-weight:700;font-size:15px;margin:10px 0;min-height:20px;color:#ffd166}
.overlay{position:fixed;inset:0;background:#0b1020f2;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;padding:24px;text-align:center}
.overlay.active{display:flex}
.overlay .big{font-size:26px;font-weight:800;margin-bottom:12px}
.overlay .txt{color:#9fb0d8;font-size:14px;margin-bottom:24px;line-height:1.6}
.overlay .btn{max-width:320px}
.countline{text-align:center;color:#9fb0d8;font-size:12px;margin:4px 0}
.backline{display:flex;justify-content:center;margin-top:6px}
</style>
</head>
<body>
<div id="app">

  <!-- ГЛАВНОЕ МЕНЮ -->
  <div class="screen active" id="scr-menu">
    <div class="logo">⚓ Корабли</div>
    <div class="sub">Морской бой. Флот: 1 линкор, 2 крейсера,<br>3 эсминца, 4 катера.<br>Корабли не соприкасаются даже углами.</div>
    <button class="btn primary" onclick="startBot()">🤖 С ботом</button>
    <button class="btn duo" onclick="startHotseat()">👥👥 Двое на одном телефоне</button>
    <button class="btn ghost" onclick="startOnline()">👥 С друзьями (онлайн)</button>
  </div>

  <!-- РАССТАНОВКА -->
  <div class="screen" id="scr-setup">
    <div class="seclabel" id="setupTitle">⚓ Расставьте флот</div>
    <div class="hint">Выберите корабль и нажмите две клетки (для катера — одну)</div>
    <div class="fleetrow" id="fleet"></div>
    <div class="fieldrow">
      <div class="board" id="setupBoard"></div>
      <div class="vlabel" id="setupVlabel">PLAYER 1</div>
    </div>
    <div class="row2">
      <button class="btn ghost" onclick="randomSetup()">🎲 Случайно</button>
      <button class="btn ghost" onclick="clearSetup()">🔄 Сброс</button>
    </div>
    <button class="btn primary" id="btnReady" onclick="confirmSetup()" disabled>⚔️ В бой!</button>
    <div class="backline"><button class="btn ghost small" style="width:auto;padding:8px 18px" onclick="toMenu()">← Назад</button></div>
  </div>

  <!-- БОЙ -->
  <div class="screen" id="scr-battle">
    <div class="status" id="turnLabel"></div>
    <div class="seclabel" id="ownLabel"></div>
    <div class="fieldrow">
      <div class="board" id="ownBoard"></div>
      <div class="vlabel" id="ownVlabel"></div>
    </div>
    <div class="seclabel" id="enemyLabel"></div>
    <div class="fieldrow">
      <div class="board" id="enemyBoard"></div>
      <div class="vlabel enemy" id="enemyVlabel"></div>
    </div>
    <div class="countline" id="enemyCount"></div>
    <div class="status" id="msgLine" style="font-size:13px"></div>
    <button class="btn ghost small" style="width:auto;margin:8px auto;padding:8px 18px" onclick="toMenu()">🔄 Новая игра</button>
  </div>

  <!-- ОВЕРЛЕЙ ПЕРЕДАЧИ ТЕЛЕФОНА -->
  <div class="overlay" id="passOverlay">
    <div class="big" id="passTitle">📱 Передайте телефон</div>
    <div class="txt" id="passText"></div>
    <button class="btn duo" id="passBtn" onclick="passContinue()">Я Player 2 — продолжить</button>
  </div>

  <!-- ФИНАЛ -->
  <div class="overlay" id="overOverlay">
    <div class="big" id="overTitle"></div>
    <div class="txt" id="overText"></div>
    <button class="btn primary" onclick="toMenu()">🔄 Играть снова</button>
  </div>

  <!-- СООБЩЕНИЕ (для онлайн-режима) -->
  <div class="overlay" id="infoOverlay">
    <div class="big">ℹ️ Онлайн-режим</div>
    <div class="txt" id="infoText"></div>
    <button class="btn ghost" onclick="hideInfo()">Понятно</button>
  </div>

</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
try { if (tg) tg.expand(); } catch(e) {}
function haptic(kind){
  try {
    if (!tg || !tg.HapticFeedback) return;
    if (kind === "light" || kind === "medium" || kind === "heavy") tg.HapticFeedback.impactOccurred(kind);
    else tg.HapticFeedback.notificationOccurred(kind);
  } catch(e) {}
}

const SIZES = [4,3,2,1];
const NAMES = {4:"Линкор (4 клетки)",3:"Крейсер (3)",2:"Эсминец (2)",1:"Катер (1)"};
const COUNTS = {4:1,3:2,2:3,1:4};

let mode = null;          // "bot" | "hot"
let boards = null;        // [board0, board1]
let setupIdx = 0;         // кто расставляет (индекс)
let selSize = 4;
let pending = null;       // первая выбранная клетка
let turn = 0;             // кто стреляет
let busy = false;         // блокировка на время хода бота

function newBoard(){
  return { grid:new Array(100).fill(0), ships:[], shots:new Array(100).fill(0), placed:{4:0,3:0,2:0,1:0} };
}
function idx(r,c){ return r*10+c; }
function rc(i){ return [Math.floor(i/10), i%10]; }
function label(i){
  if (mode === "bot") return i === 0 ? "PLAYER 1" : "🤖 БОТ";
  return i === 0 ? "PLAYER 1" : "PLAYER 2";
}
function neighbors(i){
  const [r,c] = rc(i); const out=[];
  if (r>0) out.push(idx(r-1,c)); if (r<9) out.push(idx(r+1,c));
  if (c>0) out.push(idx(r,c-1)); if (c<9) out.push(idx(r,c+1));
  return out;
}
function cellsFor(i, size, vert){
  const [r,c] = rc(i); const out=[];
  for (let k=0;k<size;k++){
    const rr = vert ? r+k : r, cc = vert ? c : c+k;
    if (rr>9 || cc>9) return null;
    out.push(idx(rr,cc));
  }
  return out;
}
function canPlace(b, cells){
  for (const i of cells){
    if (b.grid[i]) return false;
    const [r,c] = rc(i);
    for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++){
      const rr=r+dr, cc=c+dc;
      if (rr>=0 && rr<10 && cc>=0 && cc<10 && b.grid[idx(rr,cc)]) return false;
    }
  }
  return true;
}
function placeShip(b, cells, size){
  const id = b.ships.length + 1;
  cells.forEach(i => b.grid[i] = id);
  b.ships.push({cells, id, hits:0, size});
  b.placed[size]++;
}
function allPlaced(b){
  for (const s of SIZES) if ((b.placed[s]||0) < COUNTS[s]) return false;
  return true;
}
function randomFill(b){
  for (const s of SIZES){
    let need = COUNTS[s] - (b.placed[s]||0);
    let guard = 0;
    while (need > 0 && guard < 5000){
      guard++;
      const i = Math.floor(Math.random()*100);
      const cells = cellsFor(i, s, Math.random() < .5);
      if (cells && canPlace(b, cells)){ placeShip(b, cells, s); need--; }
    }
  }
}
function shipSunk(b, ship){ return ship.hits === ship.cells.length; }
function shipsLeft(b){ return b.ships.filter(s => !shipSunk(b,s)).length; }
function fleetEmpty(b){ return shipsLeft(b) === 0; }

function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function toMenu(){
  busy = false; pending = null; phase = "menu";
  document.getElementById("passOverlay").classList.remove("active");
  document.getElementById("overOverlay").classList.remove("active");
  show("scr-menu");
}

/* ---------- МЕНЮ ---------- */
function startBot(){
  mode = "bot";
  boards = [newBoard(), newBoard()];
  setupIdx = 0; selSize = 4; pending = null;
  openSetup();
}
function startHotseat(){
  mode = "hot";
  boards = [newBoard(), newBoard()];
  setupIdx = 0; selSize = 4; pending = null;
  openSetup();
}
function startOnline(){
  const msg = "Онлайн-режим недоступен в этой версии файла: оригинальный код Mini App не дошёл до меня в виде исходника. Пришлите index.html кодом (файлом или текстом) — и я верну онлайн-режим без изменений.";
  try { if (tg && tg.showAlert) { tg.showAlert(msg); return; } } catch(e) {}
  document.getElementById("infoText").textContent = msg;
  document.getElementById("infoOverlay").classList.add("active");
}
function hideInfo(){ document.getElementById("infoOverlay").classList.remove("active"); }

/* ---------- РАССТАНОВКА ---------- */
function openSetup(){
  show("scr-setup");
  document.getElementById("setupTitle").textContent = "⚓ Расставьте флот — " + label(setupIdx);
  document.getElementById("setupVlabel").textContent = label(setupIdx);
  renderFleet();
  renderSetupBoard();
  updateReadyBtn();
}
function renderFleet(){
  const f = document.getElementById("fleet");
  f.innerHTML = "";
  for (const s of SIZES){
    const left = COUNTS[s] - boards[setupIdx].placed[s];
    const b = document.createElement("button");
    b.className = "fleetbtn" + (s === selSize ? " sel" : "") + (left === 0 ? " empty" : "");
    b.textContent = NAMES[s] + " ×" + left;
    b.onclick = () => { selSize = s; pending = null; renderFleet(); renderSetupBoard(); };
    f.appendChild(b);
  }
}
function renderSetupBoard(){
  const el = document.getElementById("setupBoard");
  el.innerHTML = "";
  const b = boards[setupIdx];
  for (let i=0;i<100;i++){
    const d = document.createElement("div");
    d.className = "cell inter";
    if (b.grid[i]) d.classList.add("ship");
    if (pending === i) d.classList.add("pend");
    d.onclick = () => tapSetup(i);
    el.appendChild(d);
  }
}
function tapSetup(i){
  const b = boards[setupIdx];
  if (selSize === 1){
    if (canPlace(b, [i])){ placeShip(b, [i], 1); haptic("light"); }
    renderFleet(); renderSetupBoard(); updateReadyBtn();
    return;
  }
  if (pending === null){ pending = i; renderSetupBoard(); return; }
  if (pending === i){ pending = null; renderSetupBoard(); return; }
  const [r1,c1] = rc(pending), [r2,c2] = rc(i);
  let cells = null;
  if (r1 === r2 && Math.abs(c2-c1) === selSize-1){
    const c = Math.min(c1,c2);
    cells = cellsFor(idx(r1,c), selSize, false);
  } else if (c1 === c2 && Math.abs(r2-r1) === selSize-1){
    const r = Math.min(r1,r2);
    cells = cellsFor(idx(r,c1), selSize, true);
  }
  if (cells && canPlace(b, cells)){
    placeShip(b, cells, selSize); pending = null; haptic("light");
    // автопереход на следующий доступный размер
    for (const s of SIZES){
      if ((b.placed[s]||0) < COUNTS[s]){ selSize = s; break; }
    }
  } else {
    pending = i; haptic("light");
  }
  renderFleet(); renderSetupBoard(); updateReadyBtn();
}
function updateReadyBtn(){
  document.getElementById("btnReady").disabled = !allPlaced(boards[setupIdx]);
}
function randomSetup(){
  boards[setupIdx] = newBoard();
  randomFill(boards[setupIdx]);
  pending = null; haptic("success");
  renderFleet(); renderSetupBoard(); updateReadyBtn();
}
function clearSetup(){
  boards[setupIdx] = newBoard();
  pending = null;
  renderFleet(); renderSetupBoard(); updateReadyBtn();
}

/* ---------- ПЕРЕДАЧА ТЕЛЕФОНА ---------- */
let passCb = null;
function showPass(title, text, btnText, cb){
  document.getElementById("passTitle").textContent = title;
  document.getElementById("passText").textContent = text;
  document.getElementById("passBtn").textContent = btnText;
  passCb = cb;
  document.getElementById("passOverlay").classList.add("active");
}
function passContinue(){
  document.getElementById("passOverlay").classList.remove("active");
  haptic("light");
  if (passCb) { const f = passCb; passCb = null; f(); }
}

function confirmSetup(){
  if (setupIdx === 0){
    if (mode === "bot"){
      randomFill(boards[1]);
      turn = 0; busy = false;
      show("scr-battle"); renderBattle();
    } else {
      showPass("📱 Передайте телефон",
        "PLAYER 1 расставил флот. Теперь телефон берёт PLAYER 2 — его расстановку видно не будет.",
        "Я PLAYER 2 — начать расстановку",
        () => { setupIdx = 1; selSize = 4; pending = null; boards[1] = newBoard(); openSetup(); });
    }
  } else {
    turn = 0; busy = false;
    showPass("📱 Всё готово!",
      "Оба флота расставлены. Первым стреляет PLAYER 1. Передайте телефон PLAYER 1.",
      "Я PLAYER 1 — в бой!",
      () => { show("scr-battle"); renderBattle(); });
  }
}

/* ---------- БОЙ ---------- */
function renderBoard(el, b, reveal, interactive){
  el.innerHTML = "";
  for (let i=0;i<100;i++){
    const d = document.createElement("div");
    const shot = b.shots[i];
    let cls = "cell" + (interactive ? " inter" : "");
    if (shot === 1) cls += " miss";
    if (shot === 2){
      const s = b.ships.find(x => x.id === b.grid[i]);
      if (s && shipSunk(b, s)) cls += " sunk"; else cls += " hit";
    } else if (reveal && b.grid[i]){
      cls += " ship";
    }
    d.className = cls;
    if (interactive) d.onclick = () => tapEnemy(i);
    el.appendChild(d);
  }
}
function renderBattle(){
  const ownEl = document.getElementById("ownBoard");
  const enemyEl = document.getElementById("enemyBoard");
  if (mode === "bot"){
    document.getElementById("ownLabel").textContent = "⚓ Ваш флот — PLAYER 1";
    document.getElementById("ownVlabel").textContent = "PLAYER 1";
    document.getElementById("enemyLabel").textContent = "🎯 Поле 🤖 БОТ — тапайте по клеткам";
    document.getElementById("enemyVlabel").textContent = "🤖 БОТ";
    renderBoard(ownEl, boards[0], true, false);
    renderBoard(enemyEl, boards[1], false, !busy);
  } else {
    document.getElementById("ownLabel").textContent = "⚓ Ваш флот — " + label(turn);
    document.getElementById("ownVlabel").textContent = label(turn);
    document.getElementById("enemyLabel").textContent = "🎯 Поле " + label(1-turn) + " — тапайте по клеткам";
    document.getElementById("enemyVlabel").textContent = label(1-turn);
    renderBoard(ownEl, boards[turn], true, false);
    renderBoard(enemyEl, boards[1-turn], false, true);
  }
  document.getElementById("turnLabel").textContent = "🚀 Ход: " + label(turn);
  document.getElementById("enemyCount").textContent =
    "Кораблей у " + label(1-turn) + " осталось: " + shipsLeft(boards[1-turn]);
}

function fire(attacker, defenderBoardIdx, cell){
  const b = boards[defenderBoardIdx];
  if (b.shots[cell]) return null;
  const shipId = b.grid[cell];
  if (shipId){
    b.shots[cell] = 2;
    const s = b.ships.find(x => x.id === shipId);
    s.hits++;
    return { hit:true, sunk: shipSunk(b,s) };
  }
  b.shots[cell] = 1;
  return { hit:false };
}

function tapEnemy(i){
  const b = boards[1-turn];
  if (b.shots[i]) return;
  const res = fire(turn, 1-turn, i);
  if (res === null) return;
  if (res.hit){ haptic(res.sunk ? "error" : "heavy"); } else { haptic("light"); }
  document.getElementById("msgLine").textContent =
    res.hit ? (res.sunk ? "💥 Потопил(а) корабль! Стреляйте ещё." : "🎯 Попадание! Стреляйте ещё.") : "💧 Промах.";

  if (fleetEmpty(b)){ finishGame(turn); return; }

  if (mode === "bot"){
    renderBattle();
    if (!res.hit){
      busy = true; renderBattle();
      setTimeout(botTurn, 700);
    } else {
      renderBattle();
    }
  } else {
    renderBattle();
    if (!res.hit){
      showPass("📱 Передайте телефон",
        "Промах! Теперь стреляет " + label(1-turn) + ". Передайте телефон.",
        "Я " + label(1-turn) + " — продолжить",
        () => { turn = 1 - turn; document.getElementById("msgLine").textContent = ""; renderBattle(); });
    }
  }
}

function botPick(){
  const b = boards[0];
  const cands = [];
  for (let i=0;i<100;i++){
    if (b.shots[i] === 2){
      const s = b.ships.find(x => x.id === b.grid[i]);
      if (s && !shipSunk(b,s)) for (const n of neighbors(i)) if (!b.shots[n]) cands.push(n);
    }
  }
  if (cands.length) return cands[Math.floor(Math.random()*cands.length)];
  const free = [];
  for (let i=0;i<100;i++) if (!b.shots[i]) free.push(i);
  return free[Math.floor(Math.random()*free.length)];
}
function botTurn(){
  const cell = botPick();
  const res = fire(1, 0, cell);
  if (res === null){ busy = false; renderBattle(); return; }
  if (res.hit){ haptic("heavy"); } else { haptic("light"); }
  document.getElementById("msgLine").textContent =
    res.hit ? "🤖 БОТ попал по вашему флоту!" : "💧 БОТ промахнулся.";
  if (fleetEmpty(boards[0])){ finishGame(1); return; }
  if (res.hit){
    renderBattle();
    setTimeout(botTurn, 700);
  } else {
    busy = false;
    document.getElementById("msgLine").textContent = "🚀 Ваш ход! Тапайте по полю БОТа.";
    renderBattle();
  }
}

function finishGame(winner){
  renderBattle();
  document.getElementById("overTitle").textContent =
    "🏆 Победа! " + label(winner) + " потопил(а) весь флот!";
  document.getElementById("overText").textContent =
    mode === "bot"
      ? (winner === 0 ? "Бот повержен. Так держать!" : "Бот оказался сильнее. Попробуйте ещё раз!")
      : "Передайте телефон — оба флота видны за оверлеем не будут. Нажмите «Играть снова», чтобы посмотреть расстановки.";
  haptic("success");
  document.getElementById("overOverlay").classList.add("active");
}
</script>
</body>
</html>
